# Overrides the fuse-common default, which ships everything commented out.
#
# wayblue keeps RPM-owned config under /usr/etc, and the `files` module runs
# after the rpm-ostree module, so this file wins. ostree merges /usr/etc into
# /etc on deploy, so libfuse reads it from /etc/fuse.conf at runtime.
#
# Only `#` comments are valid here -- libfuse warns about lines it cannot parse.

# Let non-root users pass allow_other / allow_root. Needed for
# `rclone mount --allow-other`, `sshfs -o allow_other` and anything else that
# has to expose a FUSE mount beyond the user that created it.
user_allow_other

# Maximum number of FUSE mounts allowed to non-root users. The libfuse default
# (1000) is plenty here; left commented for discoverability.
# mount_max = 1000
