# The ogc kernel's hid-lenovo-go takes the Legion Go controller from
# hid-generic/hid-multitouch. Its touchpad exposes only BTN_TOUCH (no
# BTN_MOUSE, BTN_TOOL_FINGER or click), so HHD's Legion Go emulation fails with
# "Device ... Touchpad not found" and the touchpad stops working.
#
# `install ... /bin/false` also blocks explicit and dependency loads; a plain
# blacklist only stops alias-based autoloading. The initramfs omits the
# driver too (files/scripts/installkernel.sh).
blacklist hid_lenovo_go
install hid_lenovo_go /bin/false
