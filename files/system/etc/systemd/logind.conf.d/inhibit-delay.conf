# Give nirigo-swayidle.service enough time to bring swaylock up before the
# machine actually suspends.
#
# swayidle -w holds a logind "delay" inhibitor while it runs `swaylock -f`.
# InhibitDelayMaxSec caps how long logind honours that inhibitor; the default
# of 5s is tight on a handheld under load, and once it elapses logind suspends
# anyway -- leaving you to resume on an unlocked session.
[Login]
InhibitDelayMaxSec=10
