---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: nirigo
# description will be included in the image's metadata
description: Niri on Legion Go

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/niri
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:

  # Bazzite's handheld kernel ("ogc" flavor) now ships from ublue-os/akmods.
  # The old ghcr.io/bazzite-org/kernel-bazzite repo is stuck on f43.
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/ublue-os/akmods:ogc-44 /kernel-rpms /tmp/rpms/kernel
  - type: script
    scripts:
      - installkernel.sh
      - allow-nix.sh
      # - patch-mt7xxx.sh
      # - xpad.sh
      # - ublue-acpi_call.sh

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/hhd-dev/hhd/repo/fedora-%OS_VERSION%/hhd-dev-hhd-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-%OS_VERSION%/scottames-ghostty-fedora-%OS_VERSION%.repo
    install:
      - ghostty
      - hhd
      - hhd-ui
      - git-crypt
      - tailscale
      - wdisplays
      - ydotool
      - acpica-tools
      - input-remapper
      - ca-certificates
      # Secret portal / keyring backend. niri only Recommends it and wayblue
      # builds with weak deps disabled, so pull it in explicitly. See
      # files/system/usr/etc/niri/config.d/30-session.kdl.
      - gnome-keyring
      - pam-u2f
      - pamu2fcfg
      - yubikey-manager
      - podman-compose
      # FUSE userspace filesystems. fuse3/fuse-common/fuse3-libs,
      # fuse-overlayfs and the whole gvfs stack (including gvfs-mtp and
      # gvfs-gphoto2, so phones/cameras already mount in Thunar) come from the
      # base image -- listing any of those here would abort the build with
      # "Package '...' is already in the base".
      - fuse-sshfs
      - rclone
      - gocryptfs
      # FUSE v2. Fedora Atomic drops fuse/fuse-libs on purpose
      # (https://fedoraproject.org/wiki/Changes/AtomicDesktopDropFuse2) but
      # AppImages still want libfuse.so.2. Listing `fuse` pulls in fuse-libs as
      # a dependency; naming fuse-libs explicitly is not needed.
      - fuse

  # Removals live in a script instead of the module's `remove:` list so that
  # packages missing from the base image don't abort the build.
  - type: script
    scripts:
      - remove-packages.sh

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - NerdFontsSymbolsOnly
      url-fonts:
        - name: MapleMono
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF.zip

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        remove:
          - org.gnome.eog
        install:
          - com.vivaldi.Vivaldi
          - org.gnome.Loupe

  - type: systemd
    system:
      enabled:
        - input-remapper.service

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Must run after the files module: builds the niri include chain from
  # /usr/etc/niri/config.d/ and validates the resulting config.
  - type: script
    scripts:
      - niri-dropins.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
