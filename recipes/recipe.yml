---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: nirigo
# description will be included in the image's metadata
description: Niri on Legion Go

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/niri
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:

  # Bazzite's handheld kernel ("ogc" flavor) now ships from ublue-os/akmods.
  # The old ghcr.io/bazzite-org/kernel-bazzite repo is stuck on f43.
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/ublue-os/akmods:ogc-44 /kernel-rpms /tmp/rpms/kernel
  - type: script
    scripts:
      - installkernel.sh
      - install-inputplumber.sh
      - allow-nix.sh
      # - patch-mt7xxx.sh
      # - xpad.sh

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-%OS_VERSION%/scottames-ghostty-fedora-%OS_VERSION%.repo
    install:
      - ghostty
      - git-crypt
      - tailscale
      - wdisplays
      - ydotool
      - acpica-tools
      - ca-certificates
      # Secret portal / keyring backend. niri only Recommends it and wayblue
      # builds with weak deps disabled, so pull it in explicitly. See
      # files/system/usr/etc/niri/config.d/30-session.kdl.
      - gnome-keyring
      - pam-u2f
      - pamu2fcfg
      - yubikey-manager
      # FIDO2 CLI (fido2-token/-cred/-assert), needed to set or change the
      # YubiKey PIN that guards the LUKS keyslot. libfido2 itself is NOT listed:
      # it is a hard dependency of openssh-clients and already in the base, so
      # naming it would abort the build. systemd-cryptenroll and
      # systemd-cryptsetup come from the systemd package -- Fedora has no
      # separate systemd-cryptsetup subpackage.
      - fido2-tools
      - podman-compose
      # FUSE userspace filesystems. fuse3/fuse-common/fuse3-libs,
      # fuse-overlayfs and the whole gvfs stack (including gvfs-mtp and
      # gvfs-gphoto2, so phones/cameras already mount in Thunar) come from the
      # base image -- listing any of those here would abort the build with
      # "Package '...' is already in the base".
      - fuse-sshfs
      - rclone
      - gocryptfs
      # FUSE v2 remains useful for AppImages on Fedora Atomic.
      - fuse

  # DNF tolerates dependencies already provided by the base image.
  - type: dnf
    repos:
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
    install:
      install-weak-deps: false
      packages:
        # AppImages can dynamically load libfuse.so.2.
        - fuse-libs
        - quickshell
        - dms
        - dms-greeter
        - greetd
        - gnome-keyring-pam
        - xdg-desktop-portal-gnome
        - matugen
        - danksearch
        - cliphist
        - cava
        - material-symbols-fonts
        - qt6-qtmultimedia
        - qt6ct-kde
        - acl
        - libnotify

  # Bazzite's patched gamescope. Its COPR replaces many core packages, so the
  # script enables it for this single install and removes it afterwards.
  - type: script
    scripts:
      - install-gamescope.sh

  # Removals live in a script instead of the module's `remove:` list so that
  # packages missing from the base image don't abort the build.
  - type: script
    scripts:
      - remove-packages.sh

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - NerdFontsSymbolsOnly
      url-fonts:
        - name: MapleMono
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF.zip

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - notify: true
        scope: system
        repo:
          title: Flathub (system)
        remove:
          - org.gnome.eog
        install:
          - com.vivaldi.Vivaldi
          - org.gnome.Loupe

  # Install the pinned plugin first; image files overlay its focus fixes.
  - type: script
    scripts:
      - install-virtualkeyboard.sh

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # SDDM is disabled before removal; greetd claims display-manager.service.
  - type: systemd
    system:
      enabled:
        - greetd.service
        - ydotool.service
        - inputplumber.service
        - nirigo-inputplumber-migrate.service
        - nirigo-steamos-manager-migrate.service
        - nirigo-steam-migrate.service
        - steamos-manager.service
      masked:
        - sddm.service
        - sddm-boot.service
    user:
      enabled:
        - dms.service
        - steamos-manager.service
      masked:
        - nirigo-swayidle.service

  # Must run after the files module: builds the niri include chain from
  # /usr/etc/niri/config.d/ and validates the resulting config.
  - type: script
    scripts:
      - check-niri-config-drift.sh
      - niri-dropins.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
